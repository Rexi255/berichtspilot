# Dependency updates (step 8.3). PRs go to `development` (E-025) and reach
# `main` with the next release. GitHub's security updates always target `main`:
# after merging one there, merge `main` back into `development`.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: development
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Berlin
    # Fresh releases wait a week — most malicious npm versions are pulled
    # within days (security updates are not delayed)
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      # Alone, majors included: read
      # https://www.electronjs.org/docs/latest/breaking-changes before merging
      electron:
        patterns: [electron]
      # Builds the installer and the update metadata (latest*.yml) — check a
      # local build before merging (minor + patch only, see `ignore`)
      electron-builder:
        patterns: [electron-builder]
      # Pinned on purpose (E-017): check the hosts it contacts and the headers
      # it sends against the allowlist before merging
      electron-updater:
        patterns: [electron-updater]
      # Everything else: minor + patch in one PR
      dependencies:
        patterns: ['*']
        exclude-patterns: [electron, electron-builder, electron-updater]
        update-types: [minor, patch]
    # Majors of everything but Electron are done by hand when we decide to
    # (E-027; ESLint 10 needs a config migration, for example). Electron's
    # majors stay on: only the newest three are supported. `ignore` has no
    # exceptions, so the patterns list all other packages — add a new
    # dependency here as well.
    ignore:
      - dependency-name: '@*'
        update-types: [version-update:semver-major]
      - dependency-name: 'electron-*'
        update-types: [version-update:semver-major]
      - dependency-name: 'eslint*'
        update-types: [version-update:semver-major]
      - dependency-name: 'react*'
        update-types: [version-update:semver-major]
      - dependency-name: 'vite*'
        update-types: [version-update:semver-major]
      - dependency-name: concurrently
        update-types: [version-update:semver-major]
      - dependency-name: cross-env
        update-types: [version-update:semver-major]
      - dependency-name: globals
        update-types: [version-update:semver-major]
      - dependency-name: gsap
        update-types: [version-update:semver-major]
      - dependency-name: lenis
        update-types: [version-update:semver-major]
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]
      - dependency-name: wait-on
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
