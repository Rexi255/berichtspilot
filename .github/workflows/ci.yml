# Quality check on every push/PR: lint + tests (format/holiday/date logic) +
# renderer build. The app builds themselves only run in the release workflow.
name: CI

on:
  push:
    branches: [main, development]
  pull_request: {}

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24 # = .nvmrc; the Node inside Electron 43, ships npm 11
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Renderer build
        run: npm run build:renderer
