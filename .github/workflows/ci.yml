# Quality check on every push/PR: lint + tests (format/holiday/date logic) +
# renderer build, and the end-to-end tests (browser + Electron, phase 10).
# The app builds themselves only run in the release workflow.
name: CI

on:
  push:
    branches: [main, development]
  pull_request: {}

# Read-only token; actions pinned to commit SHAs (step 9.1, E-030)
permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # = .nvmrc; the Node inside Electron 44, ships npm 11
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Renderer build
        run: npm run build:renderer

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Headless Chromium for the browser test; Electron brings its own
      - name: Playwright Chromium
        run: npx playwright install --with-deps --only-shell chromium

      # Builds the renderer, then browser smoke test + Electron end-to-end
      # test (needs a display → xvfb)
      - name: End-to-end tests
        run: xvfb-run -a npm run test:e2e

      - name: Traces of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces
          path: test-results/
          retention-days: 7
