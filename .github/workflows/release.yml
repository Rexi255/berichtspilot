# On a version tag (e.g. v1.1.0): builds the Windows installer (NSIS) plus the
# portable .exe and the Linux AppImage and attaches everything to a GitHub release.
#
#   git tag v1.1.0
#   git push origin v1.1.0
#
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {} # manual start from the Actions UI

permissions:
  contents: write # required to create the release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
            artifact: release/*.exe
          - os: ubuntu-latest
            script: build:linux
            artifact: release/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint & Tests
        run: |
          npm run lint
          npm test

      - name: Build
        run: npm run ${{ matrix.script }}

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
          fail_on_unmatched_files: true
