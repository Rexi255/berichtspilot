# On a version tag (e.g. v1.1.0): builds the Windows installer (NSIS) and the
# Linux AppImage and attaches them to a GitHub release — together with the
# auto-update metadata (latest.yml / latest-linux.yml, NSIS .blockmap) that
# electron-updater reads (E-017). The AppImage carries its blockmap inside.
# The tag must match "version" in package.json.
#
#   git tag v1.1.0
#   git push origin v1.1.0
#
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {} # manual start from the Actions UI

permissions:
  contents: write # required to create the release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
            artifact: |
              release/*.exe
              release/*.exe.blockmap
              release/latest.yml
          - os: ubuntu-latest
            script: build:linux
            artifact: |
              release/*.AppImage
              release/latest-linux.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # = .nvmrc
          cache: npm

      # latest.yml carries package.json's version — a mismatching tag would
      # announce an update the app can never reach (or hide a real one)
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($version)"
            exit 1
          fi

      # Release notes = this version's CHANGELOG section. Runs on a manual
      # start too, so a missing section shows up before anything is tagged.
      - name: Release notes from CHANGELOG
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for $version"
            exit 1
          fi

      - run: npm ci

      - name: Lint & Tests
        run: |
          npm run lint
          npm test

      - name: Build
        run: npm run ${{ matrix.script }}

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
